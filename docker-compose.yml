services:
  pokemon-restock:
    image: pokemon-restock:local
    container_name: pokemon-restock
    working_dir: /app
    command:
      - python
      - -u
      - main.py
      - --config
      - /app/products.json
      - --shops
      - /app/shops.json
      - --state
      - /data/search_state.json
      - --stock
      - /data/stock.json
      - --market-cache
      - /data/market_price_cache.json
      - --interval
      - "60"
    restart: unless-stopped
    volumes:
      - /home/lacanette/pokemon-restock:/app
      - pokemon-restock-state:/data

  pokemon-restock-dashboard:
    image: pokemon-restock:local
    container_name: pokemon-restock-dashboard
    working_dir: /app
    command:
      - python
      - -u
      - app.py
    environment:
      STOCK_FILE: /data/stock.json
    ports:
      - "5000:5000"
    depends_on:
      - pokemon-restock
    restart: unless-stopped
    volumes:
      - /home/lacanette/pokemon-restock:/app
      - pokemon-restock-state:/data:ro

  dashboard-tunnel:
    image: ngrok/ngrok:latest
    profiles:
      - tunnel
    command:
      - http
      - pokemon-restock-dashboard:5000
      - --url
      - https://${NGROK_DOMAIN:-tweed-popular-pledge.ngrok-free.dev}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - pokemon-restock-dashboard
    restart: unless-stopped

volumes:
  pokemon-restock-state: